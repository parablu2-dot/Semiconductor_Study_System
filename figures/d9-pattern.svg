<svg viewBox="0 0 720 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="반복 디버깅 패턴: 증상에서 환경 원인까지">
  <rect width="720" height="200" fill="#F6EFE3"/>
  <text x="28" y="34" font-size="20" font-weight="700" fill="#241C16">반복된 디버깅 패턴</text>

  <rect x="28" y="70" width="136" height="52" rx="16" fill="#D6C6AE"/>
  <text x="96" y="101" font-size="15" fill="#241C16" text-anchor="middle">증상 관찰</text>

  <rect x="196" y="70" width="136" height="52" rx="16" fill="#D6C6AE"/>
  <text x="264" y="101" font-size="15" fill="#241C16" text-anchor="middle">논리 가설</text>

  <rect x="364" y="70" width="136" height="52" rx="16" fill="#D6C6AE"/>
  <text x="432" y="101" font-size="15" fill="#241C16" text-anchor="middle">대조 실험</text>

  <rect x="532" y="70" width="160" height="52" rx="16" fill="none" stroke="#2E5E5B" stroke-width="2.5"/>
  <text x="612" y="94" font-size="13" fill="#6B5A4A" text-anchor="middle">진짜 원인</text>
  <text x="612" y="113" font-size="15" fill="#241C16" text-anchor="middle" font-weight="600">환경·배선</text>

  <line x1="164" y1="96" x2="192" y2="96" stroke="#B5761D" stroke-width="3" marker-end="url(#arrow-d9)"/>
  <line x1="332" y1="96" x2="360" y2="96" stroke="#B5761D" stroke-width="3" marker-end="url(#arrow-d9)"/>
  <line x1="500" y1="96" x2="528" y2="96" stroke="#B5761D" stroke-width="3" marker-end="url(#arrow-d9)"/>

  <path d="M264,122 C264,155 96,155 96,124" fill="none" stroke="#6B5A4A" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-d9-soft)"/>
  <text x="180" y="170" font-size="12" fill="#6B5A4A" text-anchor="middle">가설이 정정되면 처음부터 다시 관찰</text>

  <defs>
    <marker id="arrow-d9" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B5761D"/>
    </marker>
    <marker id="arrow-d9-soft" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B5A4A"/>
    </marker>
  </defs>
</svg>
